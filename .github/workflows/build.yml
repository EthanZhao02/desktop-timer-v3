name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload artifacts to
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            command: npm run build-win
            files: |
              dist/Zhiyu-Timer-*-Windows-*-Setup.exe
              dist/Zhiyu-Timer-*-Windows-*-Portable.exe
          - name: macOS Apple Silicon
            runner: macos-15
            command: npm run build-mac-arm64
            files: |
              dist/*-arm64.dmg
              dist/*-arm64.zip
          - name: macOS Intel
            runner: macos-15-intel
            command: npm run build-mac-x64
            files: dist/*-x64.zip
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build release packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.command }}
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ matrix.files }}
          draft: false
          prerelease: false
